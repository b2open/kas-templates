# =============================================================================
# kas project configuration
# Target  : Toradex Colibri iMX8QXP (colibri-imx8x)
# BSP     : 7.5.0 (Yocto Project 5.0 - Scarthgap)
# Image   : tdx-reference-minimal-image
# Manifest: git://git.toradex.com/toradex-manifest.git -b refs/tags/7.5.0
#           -m tdxref/default.xml
# =============================================================================

# Build - tdx-reference-minimal-image
header:
  version: 14
  includes:
    - fragments/bsp-7.5.0.yml

machine: colibri-imx8x
distro: tdx-xwayland
target:
  - tdx-reference-minimal-image

repos:
  # Layer meta-b2open-treinamento
  meta-b2open-treinamento:
    url: https://github.com/b2open/meta-b2open-treinamento.git
    branch: scarthgap
    path: layers/meta-b2open-treinamento

local_conf_header:
  local_conf_build: |

    # Package Management
    PACKAGE_CLASSES ?= "package_rpm"

    # Extra image configurations
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks package-management"

    # Conserving Disk Space
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE += "busybox virtual/kernel"

