# -----------------------------------------------------------------------------
# Cabecalho do bblayers.conf
# -----------------------------------------------------------------------------
bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"

# -----------------------------------------------------------------------------
# Cabecalho do local.conf
# -----------------------------------------------------------------------------
local_conf_header:
  standard: |
    # EULA FSL
    ACCEPT_FSL_EULA = "1"
    
    # DOWNLOAD DIR
    DL_DIR ?= "${TOPDIR}/../../downloads"

    # SSTTE DIR
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
    
    # LIMIT THREADS AND PARALLEL TASKS
    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j 8"
    PARALLEL_MAKEINST = "-j 8"

    # TMUX TERMINAL
    OE_TERMINAL = "tmux"

